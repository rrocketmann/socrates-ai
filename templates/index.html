<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOCRATES-AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  </head>
  <body>
    <header class="header">SOCRATES-AI</header>

    <main class="main">
      <section class="messages" id="messages"></section>

      <form class="form" id="chat-form">
        <textarea
          name="message"
          id="message-input"
          placeholder="Ask a question or share a thought..."
          required
        ></textarea>
        <button type="submit" id="send-btn">Send</button>
      </form>

      <div class="status" id="status"></div>
    </main>

    <script>
      const form = document.getElementById('chat-form');
      const messageInput = document.getElementById('message-input');
      const messages = document.getElementById('messages');
      const status = document.getElementById('status');
      const sendBtn = document.getElementById('send-btn');

      function addMessage(role, text) {
        const wrapper = document.createElement('div');
        wrapper.className = `message ${role}`;

        const roleLabel = document.createElement('div');
        roleLabel.className = 'role';
        roleLabel.textContent = role === 'assistant' ? 'SOCRATES' : 'YOU';

        const body = document.createElement('div');
        body.textContent = text;

        wrapper.appendChild(roleLabel);
        wrapper.appendChild(body);
        messages.appendChild(wrapper);
        messages.scrollTop = messages.scrollHeight;
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const message = messageInput.value.trim();
        if (!message) return;

        addMessage('user', message);
        messageInput.value = '';
        sendBtn.disabled = true;
        status.textContent = 'Thinking...';

        fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        })
          .then((response) => response.json())
          .then((data) => {
            if (!data.success) {
              status.textContent = 'Error starting conversation.';
              sendBtn.disabled = false;
              return;
            }

            addMessage('assistant', '');
            const assistantMessage = messages.lastChild;

            const eventSource = new EventSource('/stream');
            eventSource.onmessage = function (event) {
              assistantMessage.lastChild.textContent += event.data;
              messages.scrollTop = messages.scrollHeight;
            };
            eventSource.onerror = function () {
              eventSource.close();
              sendBtn.disabled = false;
              status.textContent = '';
            };
          })
          .catch((err) => {
            status.textContent = 'Network error: ' + err.message;
            sendBtn.disabled = false;
          });
      });
    </script>
  </body>
</html>
